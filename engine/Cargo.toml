[package]
name = "pulsegrid-engine"
version = "0.5.0"
edition = "2021"
description = "Real-time audio engine for the Pulsegrid DAW (Rust core, PyO3 bridge)"

[lib]
name = "daw_engine_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
cpal = "0.15"
clack-host = "0.2"
clack-extensions = { version = "0.2", features = ["audio-ports", "params", "gui", "latency", "state", "state-context", "clack-host"] }
clack-common = "0.2"
clap-sys = "0.5"
vst3-host = { version = "0.9", default-features = false }
rayon = "1.8"
symphonia = { version = "0.6", features = ["mp3"] }

[dev-dependencies]

[profile.release]
lto = false
codegen-units = 16
