[package]
name = "pulsegrid-test-synth"
version = "0.1.0"
edition = "2021"
description = "Minimal CLAP test instrument (polyphonic synth) used by Pulsegrid's generator tests. Not shipped."

[lib]
crate-type = ["cdylib"]
name = "pulsegrid_test_synth"

[dependencies]
clack-plugin = "0.2"
clack-extensions = { version = "0.2", features = ["audio-ports", "note-ports", "params", "clack-plugin"] }
clack-common = "0.2"
